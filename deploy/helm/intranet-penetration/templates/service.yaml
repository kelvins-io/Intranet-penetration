apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-control
  labels:
    app: intranet-penetration
    component: control
spec:
  type: ClusterIP
  selector:
    app: intranet-penetration
    component: control
  ports:
    - name: api
      port: {{ .Values.control.apiPort }}
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-edge
  labels:
    app: intranet-penetration
    component: edge
spec:
  type: {{ .Values.service.type }}
  selector:
    app: intranet-penetration
    component: edge
  ports:
    - name: agent-tcp
      port: {{ .Values.edge.tcpPort }}
      targetPort: agent-tcp
      protocol: TCP
    - name: agent-udp
      port: {{ .Values.edge.udpPort }}
      targetPort: agent-udp
      protocol: UDP
    - name: http
      port: {{ .Values.edge.httpPort }}
      targetPort: http
    - name: https
      port: {{ .Values.edge.httpsPort }}
      targetPort: https
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-edge-headless
  labels:
    app: intranet-penetration
    component: edge
spec:
  clusterIP: None
  selector:
    app: intranet-penetration
    component: edge
  ports:
    - name: http
      port: {{ .Values.edge.httpPort }}
      targetPort: http
