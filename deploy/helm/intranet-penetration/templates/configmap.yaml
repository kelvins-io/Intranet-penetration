apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-control-config
  labels:
    app: intranet-penetration
    component: control
data:
  control.yaml: |
    role: control
    api_listen: ":{{ .Values.control.apiPort }}"
    token: {{ .Values.config.token | quote }}
    public_host: "0.0.0.0"
    base_domain: {{ .Values.config.baseDomain | quote }}
    data_dir: "data"
    region: {{ .Values.config.region | quote }}
    enable_e2e: {{ .Values.config.enableE2E }}
    agent_mtls: {{ .Values.config.agentMTLS | quote }}
    access_default_deny: {{ .Values.config.accessDefaultDeny }}
    admin_email: {{ .Values.config.adminEmail | quote }}
    admin_password: {{ .Values.config.adminPassword | quote }}
    auto_tls: true
    cluster:
      redis_url: {{ .Values.config.redisURL | quote }}
      secret: {{ .Values.config.clusterSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-edge-config
  labels:
    app: intranet-penetration
    component: edge
data:
  edge.yaml: |
    role: edge
    control_url: "http://{{ .Release.Name }}-control:{{ .Values.control.apiPort }}"
    listen: ":{{ .Values.edge.tcpPort }}"
    quic_listen: ":{{ .Values.edge.udpPort }}"
    http_gateway: ":{{ .Values.edge.httpPort }}"
    https_gateway: ":{{ .Values.edge.httpsPort }}"
    public_host: "0.0.0.0"
    base_domain: {{ .Values.config.baseDomain | quote }}
    data_dir: "data"
    edge_id: "edge-placeholder"
    region: {{ .Values.config.region | quote }}
    enable_e2e: {{ .Values.config.enableE2E }}
    agent_mtls: {{ .Values.config.agentMTLS | quote }}
    access_default_deny: {{ .Values.config.accessDefaultDeny }}
    auto_tls: true
    tcp_port_min: 20000
    tcp_port_max: 30000
    resume_ttl: 5m
    cluster:
      redis_url: {{ .Values.config.redisURL | quote }}
      secret: {{ .Values.config.clusterSecret | quote }}
      advertise_http: "http://$(POD_IP):{{ .Values.edge.httpPort }}"
