image:
  repository: intranet-penetration
  tag: "0.4.0"
  pullPolicy: IfNotPresent

control:
  replicas: 1
  apiPort: 8090
  persistence:
    enabled: true
    size: 1Gi

edge:
  # Each replica gets edge_id edge-0, edge-1, ... via StatefulSet ordinal
  replicas: 2
  tcpPort: 7700
  udpPort: 7700
  httpPort: 8088
  httpsPort: 8443

service:
  type: LoadBalancer

config:
  region: cn-east
  enableE2E: true
  token: "change-me"
  adminEmail: "admin@localhost"
  adminPassword: "admin123"
  baseDomain: "tunnel.example.com"
  clusterSecret: "change-me-cluster"
  redisURL: "redis://redis:6379/0"
  agentMTLS: "off"
  accessDefaultDeny: false

# Redis is an external dependency (or deploy separately). Set redisURL above.
redis:
  note: "Provide config.redisURL; chart does not embed a Redis subchart."

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
