services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
    entrypoint: ["/app/control"]
    ports:
      - "8090:8090"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/control:/app/data
      - ./configs/control.yaml:/app/configs/control.yaml:ro
    command: ["-config", "/app/configs/control.yaml"]

  edge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - control
    entrypoint: ["/app/edge"]
    ports:
      - "7700:7700/tcp"
      - "7700:7700/udp"
      - "8088:8088"
      - "8443:8443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/edge:/app/data
      - ./configs/edge.yaml:/app/configs/edge.yaml:ro
    command: ["-config", "/app/configs/edge.yaml"]

  # Optional demo agent: docker compose --profile with-agent up -d
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - edge
    network_mode: host
    entrypoint: ["/app/agent"]
    volumes:
      - ./data/agent:/app/data
      - ./configs/agent.yaml:/app/configs/agent.yaml:ro
    command: ["-config", "/app/configs/agent.yaml"]
    profiles: ["with-agent"]
