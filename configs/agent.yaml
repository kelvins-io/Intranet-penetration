  # encrypted: true
  # firewall: true
  # screen_lock: true
  # attrs:
  #   dept: eng
tunnels:
  - name: demo
    type: http
    local_addr: "127.0.0.1:9000"
  - name: echo-tcp
    type: tcp
    local_addr: "127.0.0.1:9001"
